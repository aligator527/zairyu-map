# Weekly check of e-Stat for new or republished tables (在留外国人統計 and the
# 住民基本台帳 population). Only when something changed, the datasets are
# rebuilt, site/public/data is committed and the site is redeployed.
# Vercel redeploys by itself on the push; GitHub Pages is deployed below.
name: Update data from e-Stat

on:
  schedule:
    - cron: '0 18 * * 0'   # Mondays 03:00 JST
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if e-Stat has nothing new
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    env:
      PY: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Check e-Stat for new tables
        id: check
        run: python check_updates.py

      # Downloaded xlsx files are cached between runs, so only new or
      # republished tables are fetched again.
      - uses: actions/cache@v6
        if: steps.check.outputs.changed == 'true' || inputs.force
        with:
          path: |
            data/raw
            data/interim
          key: estat-raw-${{ github.run_id }}
          restore-keys: estat-raw-

      - name: Crawl and rebuild
        if: steps.check.outputs.changed == 'true' || inputs.force
        run: ./update_all.sh

      - name: Commit updated site data
        id: commit
        if: steps.check.outputs.changed == 'true' || inputs.force
        run: |
          git add site/public/data
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update data from e-Stat ($(date -u +%Y-%m-%d))"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.pushed == 'true'
    uses: ./.github/workflows/deploy-pages.yml
